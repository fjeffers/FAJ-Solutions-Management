<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Board Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>window.react = window.React; /* the icon library looks for lowercase "react" */</script>
<script src="https://unpkg.com/lucide-react@0.454.0/dist/umd/lucide-react.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
</head>
<body>
<!-- Preview of the pasted "OpsCommand Dispatch" design, unchanged except for how it loads.
     Sample data only: none of these jobs, techs or photos are FAJ's. -->
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const {
  LayoutDashboard, Plus, Search, Filter, Clock, AlertTriangle, CheckCircle2, UserCheck, MapPin, Calendar, X,
  ChevronRight, ChevronLeft, Camera, Package, FileText, PenTool, User, Phone, Mail, ArrowRight, ShieldAlert,
  MoreVertical, CheckSquare, Square
} = LucideReact;

const INITIAL_TECHNICIANS = [
  { id: 'tech-1', name: 'Alex Rivera', role: 'Sr. Field Tech', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80', status: 'Available' },
  { id: 'tech-2', name: 'Marcus Chen', role: 'Low-Voltage Tech', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&auto=format&fit=crop&q=80', status: 'In Transit' },
  { id: 'tech-3', name: 'Sarah Jenkins', role: 'HVAC & Power', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80', status: 'On Site' },
  { id: 'tech-4', name: 'David Kim', role: 'Hardware Tech', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&auto=format&fit=crop&q=80', status: 'Offline' },
];

const INITIAL_WORK_ORDERS = [
  {
    id: 'WO-1089', title: 'Emergency Rack Cutover & Patch Panel', client: 'Apex Financial Systems',
    siteName: 'HQ Main Data Center - Floor 3', address: '450 Lexington Ave, New York, NY',
    priority: 'critical', status: 'in_progress', assignedTechId: 'tech-3',
    scheduledStart: '2026-10-01 08:00', scheduledEnd: '2026-10-01 12:00',
    tasks: [
      { id: 't1', title: 'Power Lockout/Tagout Verification', completed: true, required: true },
      { id: 't2', title: 'Mount 48-Port Cat6 Patch Panel', completed: true, required: true },
      { id: 't3', title: 'Trace & Label Connections', completed: false, required: true },
      { id: 't4', title: 'Final Fluke Cable Test & Export', completed: false, required: false },
    ],
    materials: [
      { id: 'm1', name: 'Cat6 patch cable (3ft)', qty: 24, cost: 4.50 },
      { id: 'm2', name: '1U Cable Management Tray', qty: 2, cost: 28.00 },
    ],
    photos: [
      { id: 'p1', type: 'before_photo', url: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=500&auto=format&fit=crop&q=80', timestamp: '08:15 AM', lat: '40.7516', lng: '-73.9755' }
    ],
    signature: null, isOverdue: false
  },
  {
    id: 'WO-1090', title: 'Kiosk Hardware Replacement', client: 'Metro Transit Hub',
    siteName: 'Grand Central Concourse B', address: '89 E 42nd St, New York, NY',
    priority: 'high', status: 'en_route', assignedTechId: 'tech-2',
    scheduledStart: '2026-10-01 09:30', scheduledEnd: '2026-10-01 11:30',
    tasks: [
      { id: 't10', title: 'Remove Faulty Touchscreen Display', completed: false, required: true },
      { id: 't11', title: 'Install Replacement Panel (S/N: TR-9981)', completed: false, required: true },
      { id: 't12', title: 'Perform Self-Test Diagnostic', completed: false, required: true }
    ],
    materials: [ { id: 'm10', name: '21" Capacitive Touch Display Unit', qty: 1, cost: 420.00 } ],
    photos: [], signature: null, isOverdue: false
  },
  {
    id: 'WO-1091', title: 'Security Camera Maintenance & Line Test', client: 'LogiWare Warehousing',
    siteName: 'Docking Bay 4 & 5', address: '120 Industrial Pkwy, Jersey City, NJ',
    priority: 'medium', status: 'assigned', assignedTechId: 'tech-1',
    scheduledStart: '2026-10-01 13:00', scheduledEnd: '2026-10-01 15:00',
    tasks: [
      { id: 't20', title: 'Clean Optical Lenses on Camera 12 & 14', completed: false, required: true },
      { id: 't21', title: 'Adjust Field of View & Focus', completed: false, required: true },
    ],
    materials: [], photos: [], signature: null, isOverdue: false
  },
  {
    id: 'WO-1088', title: 'Fiber Termination & OTDR Audit', client: 'CloudScale Networks',
    siteName: 'POP Station East', address: '220 Hudson St, New York, NY',
    priority: 'high', status: 'completed', assignedTechId: 'tech-1',
    scheduledStart: '2026-09-30 14:00', scheduledEnd: '2026-09-30 17:00',
    tasks: [
      { id: 't30', title: 'Splice Fiber Pair 4-A', completed: true, required: true },
      { id: 't31', title: 'OTDR Loss Verification Report', completed: true, required: true }
    ],
    materials: [ { id: 'm20', name: 'Fusion Splice Sleeves', qty: 12, cost: 1.20 } ],
    photos: [
      { id: 'p2', type: 'after_photo', url: 'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=500&auto=format&fit=crop&q=80', timestamp: '04:42 PM', lat: '40.7281', lng: '-74.0078' }
    ],
    signature: { name: 'D. Vance', signedAt: '2026-09-30 16:55' }, isOverdue: false
  },
  {
    id: 'WO-1085', title: 'POS Terminal Gateway Reconfiguration', client: 'Urban Retail Outlets',
    siteName: 'Store #402 - SoHo', address: '520 Broadway, New York, NY',
    priority: 'critical', status: 'unassigned', assignedTechId: null,
    scheduledStart: '2026-10-01 07:00', scheduledEnd: '2026-10-01 09:00',
    tasks: [
      { id: 't40', title: 'Replace POS Router Gateway', completed: false, required: true },
      { id: 't41', title: 'Run PCI Compliance Connectivity Test', completed: false, required: true }
    ],
    materials: [], photos: [], signature: null, isOverdue: true
  }
];

const STATUS_COLUMNS = [
  { id: 'unassigned', label: 'Unassigned', color: 'border-slate-300 bg-slate-50 dark:bg-slate-900/40 text-slate-700 dark:text-slate-300' },
  { id: 'assigned', label: 'Assigned', color: 'border-blue-300 bg-blue-50/50 dark:bg-blue-950/20 text-blue-700 dark:text-blue-300' },
  { id: 'en_route', label: 'En Route', color: 'border-amber-300 bg-amber-50/50 dark:bg-amber-950/20 text-amber-700 dark:text-amber-300' },
  { id: 'in_progress', label: 'In Progress', color: 'border-purple-300 bg-purple-50/50 dark:bg-purple-950/20 text-purple-700 dark:text-purple-300' },
  { id: 'completed', label: 'Completed', color: 'border-emerald-300 bg-emerald-50/50 dark:bg-emerald-950/20 text-emerald-700 dark:text-emerald-300' },
];

function App() {
  const [workOrders, setWorkOrders] = useState(INITIAL_WORK_ORDERS);
  const [technicians] = useState(INITIAL_TECHNICIANS);
  const [searchQuery, setSearchQuery] = useState('');
  const [selectedTechFilter, setSelectedTechFilter] = useState('all');
  const [selectedPriorityFilter, setSelectedPriorityFilter] = useState('all');
  const [selectedWorkOrder, setSelectedWorkOrder] = useState(null);
  const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [newWO, setNewWO] = useState({ title: '', client: '', siteName: '', address: '', priority: 'medium', assignedTechId: '' });

  const filteredOrders = useMemo(() => {
    return workOrders.filter((wo) => {
      const matchesSearch =
        wo.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        wo.client.toLowerCase().includes(searchQuery.toLowerCase()) ||
        wo.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        wo.siteName.toLowerCase().includes(searchQuery.toLowerCase());
      const matchesTech = selectedTechFilter === 'all' || wo.assignedTechId === selectedTechFilter;
      const matchesPriority = selectedPriorityFilter === 'all' || wo.priority === selectedPriorityFilter;
      return matchesSearch && matchesTech && matchesPriority;
    });
  }, [workOrders, searchQuery, selectedTechFilter, selectedPriorityFilter]);

  const metrics = useMemo(() => ({
    total: workOrders.length,
    inProgress: workOrders.filter((w) => w.status === 'in_progress' || w.status === 'en_route').length,
    completed: workOrders.filter((w) => w.status === 'completed').length,
    overdue: workOrders.filter((w) => w.isOverdue || (w.status === 'unassigned' && new Date(w.scheduledStart) < new Date())).length,
    critical: workOrders.filter((w) => w.priority === 'critical' && w.status !== 'completed').length
  }), [workOrders]);

  const handleMoveStatus = (woId, direction) => {
    const statusKeys = STATUS_COLUMNS.map(c => c.id);
    setWorkOrders(prev => prev.map(wo => {
      if (wo.id === woId) {
        const currentIndex = statusKeys.indexOf(wo.status);
        const nextIndex = direction === 'next' ? Math.min(statusKeys.length - 1, currentIndex + 1) : Math.max(0, currentIndex - 1);
        return { ...wo, status: statusKeys[nextIndex] };
      }
      return wo;
    }));
  };

  const handleAssignTech = (woId, techId) => {
    setWorkOrders(prev => prev.map(wo => {
      if (wo.id === woId) {
        const newStatus = techId && wo.status === 'unassigned' ? 'assigned' : wo.status;
        return { ...wo, assignedTechId: techId || null, status: newStatus };
      }
      return wo;
    }));
  };

  const handleToggleTask = (woId, taskId) => {
    setWorkOrders(prev => prev.map(wo => {
      if (wo.id === woId) {
        return { ...wo, tasks: wo.tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t) };
      }
      return wo;
    }));
    if (selectedWorkOrder && selectedWorkOrder.id === woId) {
      setSelectedWorkOrder(prev => ({ ...prev, tasks: prev.tasks.map(t => t.id === taskId ? { ...t, completed: !t.completed } : t) }));
    }
  };

  const handleCreateWorkOrder = (e) => {
    e.preventDefault();
    if (!newWO.title || !newWO.client) return;
    const createdWO = {
      id: `WO-${Math.floor(1000 + Math.random() * 9000)}`,
      title: newWO.title, client: newWO.client,
      siteName: newWO.siteName || 'Main Location', address: newWO.address || 'Site Address TBD',
      priority: newWO.priority,
      status: newWO.assignedTechId ? 'assigned' : 'unassigned',
      assignedTechId: newWO.assignedTechId || null,
      scheduledStart: new Date().toISOString().slice(0, 16).replace('T', ' '),
      scheduledEnd: new Date(Date.now() + 7200000).toISOString().slice(0, 16).replace('T', ' '),
      tasks: [
        { id: 't_new_1', title: 'Initial Site Safety Check', completed: false, required: true },
        { id: 't_new_2', title: 'Perform Scope of Work Inspection', completed: false, required: true },
      ],
      materials: [], photos: [], signature: null, isOverdue: false
    };
    setWorkOrders(prev => [createdWO, ...prev]);
    setIsCreateModalOpen(false);
    setNewWO({ title: '', client: '', siteName: '', address: '', priority: 'medium', assignedTechId: '' });
  };

  const getPriorityBadge = (priority) => {
    switch (priority) {
      case 'critical':
        return <span className="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded bg-red-100 text-red-800 dark:bg-red-950/80 dark:text-red-300 border border-red-200 dark:border-red-800"><AlertTriangle className="w-3 h-3" /> Critical</span>;
      case 'high':
        return <span className="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-200 dark:border-amber-800">High</span>;
      case 'medium':
        return <span className="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded bg-blue-100 text-blue-800 dark:bg-blue-950/80 dark:text-blue-300">Medium</span>;
      default:
        return <span className="inline-flex items-center gap-1 text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300">Low</span>;
    }
  };

  return (
    <div className="min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col font-sans">
      <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20 px-4 lg:px-8 py-3.5 flex items-center justify-between shadow-sm">
        <div className="flex items-center gap-3">
          <div className="p-2 bg-indigo-600 text-white rounded-lg shadow-md"><LayoutDashboard className="w-5 h-5" /></div>
          <div>
            <h1 className="text-lg font-bold tracking-tight leading-none">OpsCommand Dispatch</h1>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Field Operations & Work Order Manager</p>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <button onClick={() => setIsCreateModalOpen(true)} className="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition-all duration-150 active:scale-95">
            <Plus className="w-4 h-4" /> New Work Order
          </button>
        </div>
      </header>

      {!bannerDismissed && metrics.critical > 0 && (
        <div className="bg-red-600 text-white px-4 py-2.5 flex items-center justify-between text-sm shadow-inner">
          <div className="flex items-center gap-2.5">
            <ShieldAlert className="w-5 h-5 text-red-200 animate-pulse shrink-0" />
            <span><strong>Attention Required:</strong> {metrics.critical} critical work order(s) currently active. Immediate dispatch or technician monitoring advised.</span>
          </div>
          <button onClick={() => setBannerDismissed(true)} className="p-1 hover:bg-red-700 rounded transition-colors"><X className="w-4 h-4" /></button>
        </div>
      )}

      <main className="flex-1 p-4 lg:p-6 space-y-5 max-w-[1700px] w-full mx-auto">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 lg:gap-4">
          <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-3">
            <div className="p-3 bg-slate-100 dark:bg-slate-800 rounded-lg text-slate-600 dark:text-slate-300"><FileText className="w-5 h-5" /></div>
            <div><p className="text-xs font-medium text-slate-500 dark:text-slate-400">Total Jobs</p><p className="text-xl font-bold">{metrics.total}</p></div>
          </div>
          <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-3">
            <div className="p-3 bg-purple-50 dark:bg-purple-950/50 rounded-lg text-purple-600 dark:text-purple-400"><Clock className="w-5 h-5" /></div>
            <div><p className="text-xs font-medium text-slate-500 dark:text-slate-400">In Progress / Transit</p><p className="text-xl font-bold text-purple-600 dark:text-purple-400">{metrics.inProgress}</p></div>
          </div>
          <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-3">
            <div className="p-3 bg-emerald-50 dark:bg-emerald-950/50 rounded-lg text-emerald-600 dark:text-emerald-400"><CheckCircle2 className="w-5 h-5" /></div>
            <div><p className="text-xs font-medium text-slate-500 dark:text-slate-400">Completed</p><p className="text-xl font-bold text-emerald-600 dark:text-emerald-400">{metrics.completed}</p></div>
          </div>
          <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-3">
            <div className="p-3 bg-red-50 dark:bg-red-950/50 rounded-lg text-red-600 dark:text-red-400"><AlertTriangle className="w-5 h-5" /></div>
            <div><p className="text-xs font-medium text-slate-500 dark:text-slate-400">Unassigned / Overdue</p><p className="text-xl font-bold text-red-600 dark:text-red-400">{metrics.overdue}</p></div>
          </div>
          <div className="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center gap-3 col-span-2 sm:col-span-1">
            <div className="p-3 bg-amber-50 dark:bg-amber-950/50 rounded-lg text-amber-600 dark:text-amber-400"><ShieldAlert className="w-5 h-5" /></div>
            <div><p className="text-xs font-medium text-slate-500 dark:text-slate-400">Critical Priority</p><p className="text-xl font-bold text-amber-600 dark:text-amber-400">{metrics.critical}</p></div>
          </div>
        </div>

        <div className="bg-white dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm flex flex-col md:flex-row gap-3 items-stretch md:items-center justify-between">
          <div className="relative flex-1">
            <Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input type="text" placeholder="Search by ID, client, location, or work order title..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
              className="w-full pl-9 pr-4 py-1.5 text-sm rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg text-sm">
              <Filter className="w-3.5 h-3.5 text-slate-400" />
              <span className="text-xs text-slate-500">Tech:</span>
              <select value={selectedTechFilter} onChange={(e) => setSelectedTechFilter(e.target.value)} className="bg-transparent font-medium text-sm focus:outline-none">
                <option value="all">All Technicians</option>
                {technicians.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            </div>
            <div className="flex items-center gap-1.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg text-sm">
              <span className="text-xs text-slate-500">Priority:</span>
              <select value={selectedPriorityFilter} onChange={(e) => setSelectedPriorityFilter(e.target.value)} className="bg-transparent font-medium text-sm focus:outline-none">
                <option value="all">All Priorities</option>
                <option value="critical">Critical Only</option>
                <option value="high">High Only</option>
                <option value="medium">Medium Only</option>
                <option value="low">Low Only</option>
              </select>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 items-start overflow-x-auto pb-4">
          {STATUS_COLUMNS.map((column) => {
            const columnOrders = filteredOrders.filter((wo) => wo.status === column.id);
            return (
              <div key={column.id} className="bg-slate-200/60 dark:bg-slate-900/50 rounded-xl p-3 border border-slate-200 dark:border-slate-800/80 flex flex-col min-h-[500px]">
                <div className={`flex items-center justify-between border-b-2 pb-2 mb-3 px-1 ${column.color}`}>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-sm tracking-wide">{column.label}</span>
                    <span className="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs px-2 py-0.5 rounded-full font-semibold">{columnOrders.length}</span>
                  </div>
                </div>
                <div className="space-y-3 flex-1">
                  {columnOrders.length === 0 ? (
                    <div className="h-32 border-2 border-dashed border-slate-300 dark:border-slate-800 rounded-lg flex items-center justify-center text-xs text-slate-400">No jobs in this stage</div>
                  ) : (
                    columnOrders.map((wo) => {
                      const assignedTech = technicians.find(t => t.id === wo.assignedTechId);
                      const completedTasks = wo.tasks.filter(t => t.completed).length;
                      return (
                        <div key={wo.id} className="bg-white dark:bg-slate-900 p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-shadow cursor-pointer relative group" onClick={() => setSelectedWorkOrder(wo)}>
                          <div className="flex items-center justify-between gap-2 mb-2">
                            <span className="text-xs font-mono font-bold text-indigo-600 dark:text-indigo-400">{wo.id}</span>
                            {getPriorityBadge(wo.priority)}
                          </div>
                          <h3 className="font-semibold text-sm line-clamp-2 leading-snug mb-1 text-slate-900 dark:text-slate-100">{wo.title}</h3>
                          <p className="text-xs text-slate-500 dark:text-slate-400 font-medium truncate mb-2">{wo.client}</p>
                          <div className="flex items-center gap-1.5 text-xs text-slate-500 mb-3">
                            <MapPin className="w-3.5 h-3.5 text-slate-400 shrink-0" />
                            <span className="truncate">{wo.siteName}</span>
                          </div>
                          {wo.tasks.length > 0 && (
                            <div className="w-full bg-slate-100 dark:bg-slate-800 rounded-full h-1.5 mb-3 overflow-hidden">
                              <div className="bg-indigo-500 h-1.5 rounded-full transition-all duration-300" style={{ width: `${(completedTasks / wo.tasks.length) * 100}%` }} />
                            </div>
                          )}
                          <div className="pt-2 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2" onClick={e => e.stopPropagation()}>
                            <div className="flex items-center gap-1.5 min-w-0">
                              {assignedTech ? (
                                <img src={assignedTech.avatar} alt={assignedTech.name} className="w-5 h-5 rounded-full object-cover shrink-0" />
                              ) : (
                                <User className="w-4 h-4 text-slate-400 shrink-0" />
                              )}
                              <select value={wo.assignedTechId || ''} onChange={(e) => handleAssignTech(wo.id, e.target.value)} className="text-xs bg-transparent text-slate-600 dark:text-slate-300 focus:outline-none font-medium truncate max-w-[110px]">
                                <option value="">Unassigned</option>
                                {technicians.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                              </select>
                            </div>
                            <div className="flex items-center gap-0.5">
                              {column.id !== 'unassigned' && (
                                <button onClick={() => handleMoveStatus(wo.id, 'prev')} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-slate-400 hover:text-slate-600" title="Move Left"><ChevronLeft className="w-3.5 h-3.5" /></button>
                              )}
                              {column.id !== 'completed' && (
                                <button onClick={() => handleMoveStatus(wo.id, 'next')} className="p-1 hover:bg-slate-100 dark:hover:bg-slate-800 rounded text-slate-400 hover:text-slate-600" title="Move Right"><ChevronRight className="w-3.5 h-3.5" /></button>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </main>

      {selectedWorkOrder && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-end transition-opacity">
          <div className="bg-white dark:bg-slate-900 w-full max-w-2xl h-full shadow-2xl flex flex-col border-l border-slate-200 dark:border-slate-800">
            <div className="p-4 lg:p-6 border-b border-slate-200 dark:border-slate-800 flex items-start justify-between bg-slate-50 dark:bg-slate-900/80">
              <div className="space-y-1">
                <div className="flex items-center gap-2">
                  <span className="text-sm font-mono font-bold text-indigo-600 dark:text-indigo-400">{selectedWorkOrder.id}</span>
                  {getPriorityBadge(selectedWorkOrder.priority)}
                  <span className="text-xs px-2 py-0.5 rounded-full font-medium bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 capitalize">{selectedWorkOrder.status.replace('_', ' ')}</span>
                </div>
                <h2 className="text-xl font-bold text-slate-900 dark:text-slate-100">{selectedWorkOrder.title}</h2>
                <p className="text-xs text-slate-500">{selectedWorkOrder.client} • {selectedWorkOrder.siteName}</p>
              </div>
              <button onClick={() => setSelectedWorkOrder(null)} className="p-1.5 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-lg text-slate-500"><X className="w-5 h-5" /></button>
            </div>
            <div className="flex-1 overflow-y-auto p-4 lg:p-6 space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                <div>
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Location</h4>
                  <div className="flex items-start gap-2 text-sm">
                    <MapPin className="w-4 h-4 text-indigo-500 shrink-0 mt-0.5" />
                    <div><p className="font-semibold">{selectedWorkOrder.siteName}</p><p className="text-xs text-slate-500">{selectedWorkOrder.address}</p></div>
                  </div>
                </div>
                <div>
                  <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Assigned Field Tech</h4>
                  {selectedWorkOrder.assignedTechId ? (() => {
                    const tech = technicians.find(t => t.id === selectedWorkOrder.assignedTechId);
                    return (
                      <div className="flex items-center gap-2.5">
                        <img src={tech.avatar} alt={tech.name} className="w-8 h-8 rounded-full object-cover" />
                        <div><p className="text-sm font-semibold">{tech.name}</p><p className="text-xs text-slate-500">{tech.role}</p></div>
                      </div>
                    );
                  })() : (
                    <p className="text-xs text-slate-400 italic">No technician assigned</p>
                  )}
                </div>
              </div>

              <div>
                <h3 className="text-sm font-bold flex items-center gap-2 mb-3"><CheckSquare className="w-4 h-4 text-indigo-500" /> Scope of Work Checklist</h3>
                <div className="space-y-2">
                  {selectedWorkOrder.tasks.map((task) => (
                    <div key={task.id} onClick={() => handleToggleTask(selectedWorkOrder.id, task.id)} className="flex items-center justify-between p-3 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40 cursor-pointer transition-colors">
                      <div className="flex items-center gap-3">
                        {task.completed ? <CheckCircle2 className="w-5 h-5 text-emerald-500" /> : <Square className="w-5 h-5 text-slate-300 dark:text-slate-600" />}
                        <span className={`text-sm ${task.completed ? 'line-through text-slate-400' : 'font-medium'}`}>{task.title}</span>
                      </div>
                      {task.required && <span className="text-[10px] font-semibold text-amber-600 bg-amber-50 dark:bg-amber-950/60 px-1.5 py-0.5 rounded">Required</span>}
                    </div>
                  ))}
                </div>
              </div>

              <div>
                <h3 className="text-sm font-bold flex items-center gap-2 mb-3"><Package className="w-4 h-4 text-indigo-500" /> Materials & Parts Consumed</h3>
                {selectedWorkOrder.materials.length === 0 ? (
                  <p className="text-xs text-slate-400 italic bg-slate-50 dark:bg-slate-800/30 p-3 rounded-lg">No parts logged for this work order.</p>
                ) : (
                  <div className="border border-slate-200 dark:border-slate-800 rounded-lg overflow-hidden">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-100 dark:bg-slate-800 text-slate-500"><tr><th className="p-2.5">Item</th><th className="p-2.5">Qty</th><th className="p-2.5 text-right">Unit Price</th></tr></thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {selectedWorkOrder.materials.map(m => (
                          <tr key={m.id}><td className="p-2.5 font-medium">{m.name}</td><td className="p-2.5">{m.qty}</td><td className="p-2.5 text-right font-mono">${m.cost.toFixed(2)}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              <div>
                <h3 className="text-sm font-bold flex items-center gap-2 mb-3"><Camera className="w-4 h-4 text-indigo-500" /> Deliverables & Site Photos</h3>
                {selectedWorkOrder.photos.length === 0 ? (
                  <p className="text-xs text-slate-400 italic bg-slate-50 dark:bg-slate-800/30 p-3 rounded-lg">No photos uploaded yet.</p>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    {selectedWorkOrder.photos.map(p => (
                      <div key={p.id} className="relative group rounded-lg overflow-hidden border border-slate-200 dark:border-slate-800">
                        <img src={p.url} alt="Deliverable" className="w-full h-32 object-cover" />
                        <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent p-2 flex flex-col justify-end text-white text-[10px]">
                          <span className="font-bold">{p.type === 'before_photo' ? 'Before Photo' : 'After Photo'}</span>
                          <span className="text-slate-300">{p.timestamp} • Lat: {p.lat}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>

              <div className="bg-slate-50 dark:bg-slate-800/40 p-4 rounded-xl border border-slate-200 dark:border-slate-800">
                <h3 className="text-sm font-bold flex items-center gap-2 mb-2"><PenTool className="w-4 h-4 text-indigo-500" /> Digital Sign-Off Status</h3>
                {selectedWorkOrder.signature ? (
                  <div className="flex items-center justify-between text-xs">
                    <div><p className="font-semibold text-emerald-600 dark:text-emerald-400">Signed & Approved</p><p className="text-slate-500">By {selectedWorkOrder.signature.name}</p></div>
                    <span className="text-slate-400 font-mono">{selectedWorkOrder.signature.signedAt}</span>
                  </div>
                ) : (
                  <p className="text-xs text-amber-600 dark:text-amber-400 font-medium">Pending client site signature</p>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {isCreateModalOpen && (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-white dark:bg-slate-900 w-full max-w-lg rounded-xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div className="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-base">Create New Work Order</h3>
              <button onClick={() => setIsCreateModalOpen(false)} className="p-1 text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
            </div>
            <form onSubmit={handleCreateWorkOrder} className="p-4 space-y-4 text-sm">
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Title / Scope *</label>
                <input type="text" required placeholder="e.g., Low-Voltage Cabling Cutover" value={newWO.title} onChange={(e) => setNewWO({ ...newWO, title: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Client Name *</label>
                  <input type="text" required placeholder="e.g., Acme Corp" value={newWO.client} onChange={(e) => setNewWO({ ...newWO, client: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Priority</label>
                  <select value={newWO.priority} onChange={(e) => setNewWO({ ...newWO, priority: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="critical">Critical</option>
                  </select>
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Site Location Name</label>
                <input type="text" placeholder="e.g., Downtown Server Room B" value={newWO.siteName} onChange={(e) => setNewWO({ ...newWO, siteName: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Assign Field Technician</label>
                <select value={newWO.assignedTechId} onChange={(e) => setNewWO({ ...newWO, assignedTechId: e.target.value })} className="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  <option value="">Leave Unassigned</option>
                  {technicians.map(t => <option key={t.id} value={t.id}>{t.name} ({t.status})</option>)}
                </select>
              </div>
              <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                <button type="button" onClick={() => setIsCreateModalOpen(false)} className="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800">Cancel</button>
                <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700">Create Work Order</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
