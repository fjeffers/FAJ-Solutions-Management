  <path d="M136 322 C136 208 186 156 256 156 C326 156 376 208 376 322 Z" fill="#0D7377"/>
  <rect x="100" y="322" width="312" height="48" rx="24" fill="#0D7377"/>
  <rect x="238" y="120" width="36" height="44" rx="14" fill="#0D7377"/>
